name: Supabase and LiveKit smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Neosoul base URL
        required: true
        default: https://neosoul.udify.fun
        type: string

permissions:
  contents: read

jobs:
  providers:
    name: Deployed Supabase and LiveKit read-only smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed provider health
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --max-time 20 "${BASE_URL%/}/api/health?deep=1")"
          echo "$response"
          echo "$response" | jq -e '
            .status == "ok" and
            .checks.supabase == "ok" and
            .checks.livekit == "ok"
          '
