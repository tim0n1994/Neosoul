name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    name: Verify and publish preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm build
      - name: Package source preview
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="neosoul-${RELEASE_TAG}/" "${GITHUB_SHA}"             -o "release-assets/neosoul-${RELEASE_TAG}.tar.gz"
      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/*.tar.gz             --repo "${GITHUB_REPOSITORY}"             --title "Neosoul ${RELEASE_TAG}"             --generate-notes             --prerelease
